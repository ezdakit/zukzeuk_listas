name: Scrape eventos Acestream

on:
  workflow_dispatch:        # ejecución manual desde la pestaña Actions
  # schedule:
  #   - cron: "0 */6 * * *"   # opcional: cada 6 horas

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Ejecutar script
        env:
          # La web exige aceptar un EULA (licencia de uso personal).
          # Cámbialo a "yes" SOLO después de leerlo y aceptarlo tú.
          ACCEPT_EULA: "no"
        run: python scrape_eventos.py

      - name: Subir JSON como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventos
          path: |
            eventos.json
            debug/
          if-no-files-found: warn
