name: Scrape eventos Acestream

on:
  schedule:
    - cron: "22 */3 * * *" 
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-eventos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Instalar y arrancar nodo IPFS
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KUBO_VERSION: ""
          IPFS_PATH: ${{ runner.temp }}/.ipfs
        run: |
          set -e
          
          echo "Limpiando entorno..."
          killall -9 ipfs || true
          rm -rf "$IPFS_PATH"
          
          v=$(gh release view --repo ipfs/kubo --json tagName -q .tagName)
          echo "Instalando Kubo $v"
          gh release download "$v" --repo ipfs/kubo --pattern "kubo_${v}_linux-amd64.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/kubo_${v}_linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/kubo/ipfs" /usr/local/bin/ipfs
          
          echo "Inicializando nodo..."
          ipfs init --profile=server
          rm -f "$IPFS_PATH/repo.lock"
          
          echo "Arrancando demonio en background..."
          nohup ipfs daemon --routing=dhtclient > "$RUNNER_TEMP/ipfs.log" 2>&1 &
          
          sleep 5
          
          echo "Esperando conexión a la red P2P..."
          for i in $(seq 1 30); do ipfs swarm peers >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 30); do [ "$(ipfs swarm peers 2>/dev/null | wc -l)" -ge 3 ] && break; sleep 2; done
          
          PEERS=$(ipfs swarm peers 2>/dev/null | wc -l)
          echo "Peers conectados: $PEERS"
          
          if [ "$PEERS" -eq 0 ]; then
            echo "--- ERROR: Sin peers. Volcando log de Kubo ---"
            cat "$RUNNER_TEMP/ipfs.log"
          fi

      - name: Ejecutar script
        env:
          IPFS_PATH: ${{ runner.temp }}/.ipfs
        run: python scrape_eventos.py

      - name: Subir ficheros a la raíz del repositorio
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in elcano.json ezdakit.m3u eventos.json ezdakit_eventos.m3u; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Sin cambios que subir"
          else
            git commit -m "Actualizar listas y eventos ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
