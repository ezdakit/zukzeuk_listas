name: Scrape eventos Acestream

on:
  schedule:
    - cron: "22 */3 * * *" 
  workflow_dispatch:        # ejecución manual desde la pestaña Actions

permissions:
  contents: write           # necesario para hacer commit/push de los ficheros generados

# Evita que dos ejecuciones simultáneas se pisen al hacer push
concurrency:
  group: scrape-eventos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04   # fijado: ubuntu-latest migra a Ubuntu 26 y Playwright --with-deps podría no soportarlo aún
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          # Si quieres evitar roturas por actualizaciones, fija la versión: pip install playwright==X.Y.Z
          pip install playwright

      - name: Instalar Chromium para Playwright
        run: playwright install --with-deps chromium

      - name: Instalar y arrancar nodo IPFS
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          KUBO_VERSION: ""
          IPFS_PATH: ${{ runner.temp }}/.ipfs
        run: |
          set -e
          
          echo "Limpiando entorno..."
          # Forzar el cierre inmediato de procesos previos
          killall -9 ipfs || true
          rm -rf "$IPFS_PATH"
          
          v=$(gh release view --repo ipfs/kubo --json tagName -q .tagName)
          echo "Instalando Kubo $v"
          gh release download "$v" --repo ipfs/kubo --pattern "kubo_${v}_linux-amd64.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/kubo_${v}_linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/kubo/ipfs" /usr/local/bin/ipfs
          
          echo "Inicializando nodo..."
          ipfs init --profile=server
          
          # Eliminar cualquier bloqueo residual generado durante el init
          rm -f "$IPFS_PATH/repo.lock"
          
          echo "Arrancando demonio en background..."
          # --routing=dhtclient evita sobrecargar la red y acelera el arranque en Github Actions
          nohup ipfs daemon --routing=dhtclient > "$RUNNER_TEMP/ipfs.log" 2>&1 &
          
          # PAUSA CRÍTICA: dar tiempo al demonio a exponer la API antes de lanzarle comandos
          sleep 5
          
          echo "Esperando conexión a la red P2P..."
          for i in $(seq 1 30); do ipfs swarm peers >/dev/null 2>&1 && break; sleep 2; done
          for i in $(seq 1 30); do [ "$(ipfs swarm peers 2>/dev/null | wc -l)" -ge 3 ] && break; sleep 2; done
          
          PEERS=$(ipfs swarm peers 2>/dev/null | wc -l)
          echo "Peers conectados: $PEERS"
          
          if [ "$PEERS" -eq 0 ]; then
            echo "--- ERROR: Sin peers. Volcando log de Kubo ---"
            cat "$RUNNER_TEMP/ipfs.log"
          fi

      - name: Ejecutar script
        env:
          # La web exige aceptar un EULA (licencia de uso personal).
          # Cámbialo a "yes" SOLO después de leerlo y aceptarlo tú.
          ACCEPT_EULA: "yes"
          # Le pasamos al script de Python la ruta limpia donde levantamos IPFS
          IPFS_PATH: ${{ runner.temp }}/.ipfs
        run: python scrape_eventos.py

      # Se ejecuta aunque el scraping falle, para no perder elcano.json / ezdakit.m3u
      # (el script no sobrescribe eventos.json ni el m3u de eventos si salen vacíos).
      - name: Subir ficheros a la raíz del repositorio
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in elcano.json ezdakit.m3u eventos.json ezdakit_eventos.m3u; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "Sin cambios que subir"
          else
            git commit -m "Actualizar listas y eventos ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Solo si algo falla: capturas/HTML para depurar (ya no se sube eventos.json como artefacto)
      - name: Subir debug si falla
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: debug
          path: debug/
          if-no-files-found: warn